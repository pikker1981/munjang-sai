<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품의 경제와 언약의 경제 · S.B.S(Solafide Book Study)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/static/woff2/SUIT.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.css">
  <style>
    :root {
      --bg-desk: #ECEAE3;
      --bg-sheet: #FAF8F3;
      --bg-box: #F4F1E8;
      --bg-box-alt: #EFECE2;
      --ink: #111827;
      --ink-soft: #374151;
      --ink-muted: #57534E;
      --border: #D6D1C4;
      --border-strong: #BFB8A8;
      --accent-blue: #1D4ED8;
      --accent-blue-soft: #E8EEF9;
      --accent-teal: #0F766E;
      --accent-teal-soft: #E4F2F0;
      --accent-amber: #B45309;
      --accent-amber-soft: #F7EFE2;
      --shadow-sheet: 0 18px 48px rgba(28, 25, 23, 0.08), 0 2px 8px rgba(28, 25, 23, 0.04);
      --font-sans: 'SUIT', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-desk);
      color: var(--ink);
      font-family: var(--font-sans);
      letter-spacing: 0.018em;
      line-height: 1.9;
      word-break: keep-all;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent-blue);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1.5px;
    }

    a:hover {
      color: var(--accent-teal);
    }

    /* Top Progress Bar */
    .progress-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--border);
      z-index: 200;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-teal));
      transition: width 0.25s ease;
    }

    /* Sticky Top Navigation Shell */
    .topbar {
      position: sticky;
      top: 5px;
      z-index: 150;
      background: rgba(250, 248, 243, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }

    .topbar-inner {
      max-width: 1520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 10px;
      height: 28px;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--accent-blue), var(--accent-teal));
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--ink-muted);
      background: var(--bg-box);
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-sheet);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      line-height: 1.2;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-box);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: var(--bg-sheet);
    }

    .btn-primary:hover:not(:disabled) {
      background: #1E40AF;
      border-color: #1E40AF;
      color: var(--bg-sheet);
    }

    .btn-teal {
      background: var(--accent-teal);
      border-color: var(--accent-teal);
      color: var(--bg-sheet);
    }

    .btn-teal:hover:not(:disabled) {
      background: #115E59;
      border-color: #115E59;
      color: var(--bg-sheet);
    }

    .jump-form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-box);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 10px;
    }

    .jump-input {
      width: 58px;
      border: 1px solid var(--border-strong);
      background: var(--bg-sheet);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      padding: 5px 6px;
      border-radius: 7px;
    }

    .jump-total {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink-muted);
      font-weight: 600;
    }

    /* Category Pills Row */
    .category-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      padding-bottom: 2px;
    }

    .cat-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-box);
      color: var(--ink-soft);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .cat-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .cat-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: var(--bg-sheet);
    }

    .cat-count {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.08);
    }

    .cat-btn.active .cat-count {
      background: rgba(250, 248, 243, 0.22);
      color: var(--bg-sheet);
    }

    /* TOC Dropdown Drawer */
    .toc-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.35);
      z-index: 300;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 84px 20px 24px;
    }

    .toc-overlay.open {
      display: flex;
    }

    .toc-drawer {
      width: 100%;
      max-width: 980px;
      max-height: calc(100vh - 110px);
      background: var(--bg-sheet);
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(17, 24, 39, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toc-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-box);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toc-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
    }

    .toc-search-wrap {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toc-search {
      flex: 1;
      border: 1px solid var(--border-strong);
      background: var(--bg-box);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      padding: 11px 16px;
      border-radius: 10px;
    }

    .toc-search:focus {
      outline: 2px solid var(--accent-blue);
      background: var(--bg-sheet);
    }

    .toc-list {
      overflow-y: auto;
      padding: 14px 18px 20px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .toc-item {
      appearance: none;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--bg-box);
      border-radius: 12px;
      padding: 13px 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.14s ease;
    }

    .toc-item:hover {
      border-color: var(--accent-blue);
      background: var(--accent-blue-soft);
    }

    .toc-item.current {
      border-color: var(--accent-blue);
      background: var(--accent-blue-soft);
      box-shadow: inset 4px 0 0 var(--accent-blue);
    }

    .toc-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
    }

    .toc-item-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.45;
    }

    .toc-core-badge {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-teal);
      background: var(--accent-teal-soft);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .toc-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 36px 16px;
      color: var(--ink-muted);
      font-size: 17px;
    }

    /* Main Stage */
    .stage-wrap {
      padding: 28px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .slide-sheet {
      width: 100%;
      max-width: 1520px;
      min-height: 920px;
      background: var(--bg-sheet);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow-sheet);
      padding: 46px 56px 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
      position: relative;
    }

    /* Slide Header */
    .slide-header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slide-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .meta-category {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-blue);
      letter-spacing: 0.02em;
    }

    .meta-sep {
      color: var(--border-strong);
      font-weight: 700;
    }

    .meta-time {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-teal);
      background: var(--accent-teal-soft);
      padding: 3px 12px;
      border-radius: 999px;
    }

    .meta-core-tag {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-amber);
      background: var(--accent-amber-soft);
      padding: 3px 12px;
      border-radius: 999px;
    }

    .meta-page {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .slide-title {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
      line-height: 1.32;
      color: var(--ink);
      letter-spacing: -0.012em;
    }

    .slide-title.cover-title {
      font-size: 48px;
      line-height: 1.24;
    }

    /* Lead Box */
    .lead-box {
      background: var(--bg-box);
      border-left: 6px solid var(--accent-blue);
      border-radius: 0 14px 14px 0;
      padding: 26px 32px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.82;
      color: var(--ink);
    }

    .lead-box.teal {
      border-left-color: var(--accent-teal);
    }

    /* Slide Body */
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      align-items: stretch;
    }

    .card-box {
      background: var(--bg-box);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 380px;
    }

    .card-box.compact {
      min-height: 240px;
    }

    .card-box.accent-blue-top {
      border-top: 5px solid var(--accent-blue);
    }

    .card-box.accent-teal-top {
      border-top: 5px solid var(--accent-teal);
    }

    .card-box.accent-amber-top {
      border-top: 5px solid var(--accent-amber);
    }

    .card-heading {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-heading.blue {
      color: var(--accent-blue);
    }

    .card-heading.teal {
      color: var(--accent-teal);
    }

    .card-heading.amber {
      color: var(--accent-amber);
    }

    .body-text {
      margin: 0;
      font-size: 23px;
      line-height: 1.9;
      color: var(--ink);
    }

    .body-list {
      margin: 0;
      padding-left: 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 23px;
      line-height: 1.88;
      color: var(--ink);
    }

    .body-list li::marker {
      color: var(--accent-blue);
      font-weight: 800;
    }

    .body-list.teal li::marker {
      color: var(--accent-teal);
    }

    .quote-block {
      margin: 0;
      background: var(--bg-box-alt);
      border-left: 5px solid var(--accent-teal);
      border-radius: 0 14px 14px 0;
      padding: 24px 30px;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.85;
      color: var(--ink);
    }

    .quote-cite {
      display: block;
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-teal);
      font-style: normal;
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg-box);
    }

    .editorial-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .editorial-table th {
      background: var(--bg-box-alt);
      color: var(--ink);
      font-size: 19px;
      font-weight: 800;
      padding: 20px 22px;
      border-bottom: 2px solid var(--border-strong);
      line-height: 1.5;
    }

    .editorial-table td {
      font-size: 22px;
      line-height: 1.8;
      padding: 26px 22px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--ink);
    }

    .editorial-table tr:last-child td {
      border-bottom: none;
    }

    .editorial-table td strong {
      color: var(--accent-blue);
    }

    .editorial-table td .teal-em {
      color: var(--accent-teal);
      font-weight: 800;
    }

    /* SVG Diagram Container */
    .diagram-box {
      background: var(--bg-box);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .diagram-box svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Cover Specific */
    .cover-hero {
      display: flex;
      flex-direction: column;
      gap: 28px;
      justify-content: center;
      flex: 1;
      padding: 16px 0;
    }

    .cover-kicker {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-teal);
      letter-spacing: 0.04em;
    }

    .cover-subtitle {
      font-size: 26px;
      font-weight: 600;
      color: var(--ink-soft);
      line-height: 1.75;
      margin: 0;
      max-width: 1240px;
    }

    .cover-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 8px;
    }

    .cover-meta-card {
      background: var(--bg-box);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cover-meta-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .cover-meta-val {
      font-size: 21px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.45;
    }

    /* Bottom Summary Box */
    .summary-box {
      background: var(--bg-box-alt);
      border: 1px solid var(--border-strong);
      border-left: 6px solid var(--accent-teal);
      border-radius: 14px;
      padding: 24px 30px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .summary-label {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-teal);
      letter-spacing: 0.02em;
    }

    .summary-text {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.82;
      color: var(--ink);
    }

    /* Bottom Footer Nav */
    .bottom-nav {
      width: 100%;
      max-width: 1520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav-btn-lg {
      padding: 13px 26px;
      font-size: 17px;
      border-radius: 12px;
    }

    .shortcut-hint {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink-muted);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: var(--bg-sheet);
      font-size: 15px;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.25);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 400;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Print Container (Hidden on Screen) */
    #printContainer {
      display: none;
    }

    /* Responsive Adjustments */
    @media (max-width: 1200px) {
      .slide-sheet {
        padding: 34px 32px 32px;
        min-height: auto;
      }
      .slide-title {
        font-size: 32px;
      }
      .slide-title.cover-title {
        font-size: 38px;
      }
      .lead-box {
        font-size: 21px;
        padding: 20px 24px;
      }
      .card-heading {
        font-size: 23px;
      }
      .body-text, .body-list, .quote-block {
        font-size: 20px;
      }
      .editorial-table th {
        font-size: 17px;
        padding: 16px 16px;
      }
      .editorial-table td {
        font-size: 19px;
        padding: 18px 16px;
      }
      .cover-meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .card-box {
        min-height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        padding: 10px 14px;
      }
      .stage-wrap {
        padding: 16px 12px 32px;
      }
      .slide-sheet {
        padding: 24px 20px 24px;
        border-radius: 16px;
      }
      .grid-2, .grid-3, .toc-list, .cover-meta-grid {
        grid-template-columns: 1fr;
      }
      .slide-title {
        font-size: 26px;
      }
      .slide-title.cover-title {
        font-size: 30px;
      }
      .lead-box, .body-text, .body-list, .quote-block, .summary-text {
        font-size: 18px;
      }
      .card-heading {
        font-size: 21px;
      }
      .shortcut-hint {
        display: none;
      }
    }

    /* Print Styles */
    @media print {
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        background: var(--bg-sheet);
      }
      .progress-track,
      .topbar,
      .stage-wrap,
      .toc-overlay,
      .toast {
        display: none !important;
      }
      #printContainer {
        display: block !important;
      }
      #printContainer .slide-sheet {
        max-width: none;

      const elJumpTotal = document.getElementById('jumpTotal');
      const elCategoryBar = document.getElementById('categoryBar');
      const elPrintBtn = document.getElementById('printBtn');
      const elPrintContainer = document.getElementById('printContainer');
      const elPrevTop = document.getElementById('prevTopBtn');
      const elNextTop = document.getElementById('nextTopBtn');
      const elPrevBottom = document.getElementById('prevBottomBtn');
      const elNextBottom = document.getElementById('nextBottomBtn');
      const elToast = document.getElementById('toast');

      let toastTimer = null;
      function showToast(msg) {
        elToast.textContent = msg;
        elToast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          elToast.classList.remove('show');
        }, 2000);
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // Ignore storage errors
        }
      }

      function getVisibleSlides() {
        return state.coreOnly ? SLIDES.filter((s) => s.core) : SLIDES;
      }

      function getCategoryName(catId) {
        const found = CATEGORIES.find((c) => c.id === catId);
        return found ? found.name : '';
      }

      function buildSlideMarkup(slide, idxInList, totalInList) {
        const catName = getCategoryName(slide.category);
        const isCover = slide.id === 1;
        const headerHtml = isCover
          ? `
            <div class="slide-header" style="border-bottom:none;padding-bottom:0;">
              <div class="slide-meta-row">
                <div class="meta-left">
                  <span class="meta-category">${catName}</span>
                  <span class="meta-sep">·</span>
                  <span class="meta-time">${slide.time}</span>
                  <span class="meta-core-tag">핵심 슬라이드</span>
                </div>
                <span class="meta-page">${String(idxInList + 1).padStart(2, '0')} / ${String(totalInList).padStart(2, '0')}</span>
              </div>
            </div>
          `
          : `
            <div class="slide-header">
              <div class="slide-meta-row">
                <div class="meta-left">
                  <span class="meta-category">${catName}</span>
                  <span class="meta-sep">·</span>
                  <span class="meta-time">${slide.time}</span>
                  ${slide.core ? '<span class="meta-core-tag">핵심 슬라이드</span>' : ''}
                </div>
                <span class="meta-page">${String(idxInList + 1).padStart(2, '0')} / ${String(totalInList).padStart(2, '0')}</span>
              </div>
              <h1 class="slide-title">${slide.title}</h1>
            </div>
          `;

        return `${headerHtml}<div class="slide-body">${slide.render()}</div>`;
      }

      function renderCategories(activeCategory) {
        const visible = getVisibleSlides();
        elCategoryBar.innerHTML = CATEGORIES.map((cat) => {
          const count = visible.filter((s) => s.category === cat.id).length;
          if (count === 0) return '';
          const isActive = cat.id === activeCategory;
          return `
            <button type="button" class="cat-btn ${isActive ? 'active' : ''}" data-cat="${cat.id}">
              <span>${cat.name}</span>
              <span class="cat-count">${count}</span>
            </button>
          `;
        }).join('');
      }

      function renderToc(query) {
        const visible = getVisibleSlides();
        const q = (query || '').trim().toLowerCase();
        const activeSlide = visible[state.currentIndex];

        const filtered = visible
          .map((s, idx) => ({ slide: s, idx }))
          .filter(({ slide, idx }) => {
            if (!q) return true;
            const hay = `${idx + 1} ${slide.id} ${slide.title} ${slide.time} ${slide.keywords} ${getCategoryName(slide.category)}`.toLowerCase();
            return hay.includes(q);
          });

        if (filtered.length === 0) {
          elTocList.innerHTML = '<div class="toc-empty">검색어와 일치하는 슬라이드가 없습니다. 다른 키워드나 번호를 입력해 보세요.</div>';
          return;
        }

        elTocList.innerHTML = filtered.map(({ slide, idx }) => {
          const isCurrent = activeSlide && activeSlide.id === slide.id;
          return `
            <button type="button" class="toc-item ${isCurrent ? 'current' : ''}" data-idx="${idx}">
              <div class="toc-item-meta">
                <span>${String(idx + 1).padStart(2, '0')} · ${getCategoryName(slide.category)} · ${slide.time}</span>
                ${slide.core ? '<span class="toc-core-badge">핵심</span>' : ''}
              </div>
              <div class="toc-item-title">${slide.title}</div>
            </button>
          `;
        }).join('');
      }

      function render() {
        const visible = getVisibleSlides();
        if (state.currentIndex < 0) state.currentIndex = 0;
        if (state.currentIndex >= visible.length) state.currentIndex = visible.length - 1;

        const slide = visible[state.currentIndex];
        const total = visible.length;

        // Virtualized single-slide render
        elStage.innerHTML = buildSlideMarkup(slide, state.currentIndex, total);

        // Progress bar
        const pct = total > 1 ? ((state.currentIndex + 1) / total) * 100 : 100;
        elProgress.style.width = `${pct}%`;

        // Mode button & badge
        elModeStatus.textContent = state.coreOnly ? `핵심 ${total}장` : `전체 ${total}장`;
        elModeToggle.textContent = state.coreOnly ? '전체 보기 (36장)' : '핵심만 보기 (16장)';
        elModeToggle.setAttribute('aria-pressed', String(state.coreOnly));

        // Jump input
        elJumpInput.max = String(total);
        elJumpInput.value = String(state.currentIndex + 1);
        elJumpTotal.textContent = `/ ${total}`;

        // Prev / Next disabled state
        const atStart = state.currentIndex === 0;
        const atEnd = state.currentIndex === total - 1;
        elPrevTop.disabled = atStart;
        elPrevBottom.disabled = atStart;
        elNextTop.disabled = atEnd;
        elNextBottom.disabled = atEnd;

        renderCategories(slide.category);
        saveState();
      }

      function goToIndex(nextIdx, scrollTop) {
        const visible = getVisibleSlides();
        const clamped = Math.max(0, Math.min(visible.length - 1, nextIdx));
        state.currentIndex = clamped;
        render();
        if (scrollTop) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      function openToc() {
        renderToc(elTocSearch.value);
        elTocOverlay.classList.add('open');
        elTocToggle.setAttribute('aria-expanded', 'true');
        setTimeout(() => elTocSearch.focus(), 40);
      }

      function closeToc() {
        elTocOverlay.classList.remove('open');
        elTocToggle.setAttribute('aria-expanded', 'false');
      }

      function populatePrintView() {
        const visible = getVisibleSlides();
        elPrintContainer.innerHTML = visible.map((slide, idx) => `
          <article class="slide-sheet">${buildSlideMarkup(slide, idx, visible.length)}</article>
        `).join('');
      }

      // Event Listeners
      elPrevTop.addEventListener('click', () => goToIndex(state.currentIndex - 1, true));
      elNextTop.addEventListener('click', () => goToIndex(state.currentIndex + 1, true));
      elPrevBottom.addEventListener('click', () => goToIndex(state.currentIndex - 1, true));
      elNextBottom.addEventListener('click', () => goToIndex(state.currentIndex + 1, true));

      elModeToggle.addEventListener('click', () => {
        const prevVisible = getVisibleSlides();
        const currentSlideId = prevVisible[state.currentIndex] ? prevVisible[state.currentIndex].id : 1;
        state.coreOnly = !state.coreOnly;
        const nextVisible = getVisibleSlides();
        const matchedIdx = nextVisible.findIndex((s) => s.id === currentSlideId);
        state.currentIndex = matchedIdx >= 0 ? matchedIdx : 0;
        render();
        showToast(state.coreOnly ? '핵심만 보기 모드로 전환했습니다 (16장)' : '전체 보기 모드로 전환했습니다 (36장)');
      });

      elCategoryBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.cat-btn');
        if (!btn) return;
        const catId = btn.getAttribute('data-cat');
        const visible = getVisibleSlides();
        const firstIdx = visible.findIndex((s) => s.category === catId);
        if (firstIdx >= 0) {
          goToIndex(firstIdx, true);
        }
      });

      elJumpForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const visible = getVisibleSlides();
        const num = parseInt(elJumpInput.value, 10);
        if (Number.isNaN(num) || num < 1 || num > visible.length) {
          showToast(`1부터 ${visible.length} 사이의 번호를 입력해 주세요.`);
          elJumpInput.value = String(state.currentIndex + 1);
          return;
        }
        goToIndex(num - 1, true);
      });

      elTocToggle.addEventListener('click', openToc);
      elTocClose.addEventListener('click', closeToc);
      elTocOverlay.addEventListener('click', (e) => {
        if (e.target === elTocOverlay) closeToc();
      });

      elTocSearch.addEventListener('input', () => {
        renderToc(elTocSearch.value);
      });

      elTocList.addEventListener('click', (e) => {
        const item = e.target.closest('.toc-item');
        if (!item) return;
        const idx = parseInt(item.getAttribute('data-idx'), 10);
        if (!Number.isNaN(idx)) {
          closeToc();
          goToIndex(idx, true);
        }
      });

      elPrintBtn.addEventListener('click', () => {
        populatePrintView();
        window.print();
      });

      window.addEventListener('beforeprint', populatePrintView);

      // Keyboard Shortcuts
      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement ? document.activeElement.tagName : '';
        const isInput = tag === 'INPUT' || tag === 'TEXTAREA';

        if (e.key === 'Escape') {
          if (elTocOverlay.classList.contains('open')) {
            closeToc();
          }
          return;
        }

        if (isInput || elTocOverlay.classList.contains('open')) return;

        if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          e.preventDefault();
          goToIndex(state.currentIndex + 1, true);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          goToIndex(state.currentIndex - 1, true);
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToIndex(0, true);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToIndex(getVisibleSlides().length - 1, true);
        }
      });

      // Touch Swipe Support
      let touchStartX = 0;
      let touchStartY = 0;
      elStage.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      elStage.addEventListener('touchend', (e) => {
        if (e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) {
            goToIndex(state.currentIndex + 1, true);
          } else {
            goToIndex(state.currentIndex - 1, true);
          }
        }
      }, { passive: true });

      // Initial render
      render();
    })();
  </script>
</body>
</html>
