<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" role="img" aria-labelledby="title desc"><title id="title">침묵의 세계 — 문장 사이 창작 스터디 이미지</title><desc id="desc">회백색 종이 위에 넓은 여백, 작은 문, 침묵의 세계라는 제목을 배치한 독서 노트 표지. 실제 도서 표지가 아닙니다.</desc><defs><linearGradient id="pages" x2="1"><stop stop-color="#c7c2b5"/><stop offset=".25" stop-color="#eee8dc"/><stop offset=".9" stop-color="#f8f4eb"/><stop offset="1" stop-color="#d6cebe"/></linearGradient><linearGradient id="cover" x2="1"><stop stop-color="#c3c5b2"/><stop offset=".06" stop-color="#d5d7c5"/><stop offset=".12" stop-color="#e1e2d1"/><stop offset="1" stop-color="#dfe1ce"/></linearGradient><linearGradient id="door" x2="1"><stop stop-color="#6f735b"/><stop offset="1" stop-color="#989d7e"/></linearGradient><pattern id="paper" width="13" height="11" patternUnits="userSpaceOnUse"><path d="m0 2 3 1m5 5 2-1m4 4 2 1" stroke="#66724b" stroke-opacity=".045" stroke-width=".6"/></pattern><filter id="shadow" x="-40%" y="-30%" width="180%" height="180%"><feDropShadow dx="6" dy="12" stdDeviation="8" flood-color="#4d4638" flood-opacity=".17"/></filter></defs><g transform="translate(104 56) rotate(-3 175 245)" filter="url(#shadow)"><path d="m5 13 310-5 19 16v480L19 520 4 502Z" fill="url(#pages)"/><path d="m23 510 300-14m-300 10 300-14m-300 10 300-14m-300 10 300-14" fill="none" stroke="#c8c0b0" stroke-width=".7"/><path d="M0 0h317v493L0 509Z" fill="url(#cover)" stroke="#a8ac94" stroke-width=".8"/><path d="M0 0h317v493L0 509Z" fill="url(#paper)"/><path d="M19 1v506" stroke="#a3aa8c" stroke-opacity=".6"/><path d="M23 1v505" stroke="#fffdf1" stroke-opacity=".5"/><g fill="#4d4638" font-family="Batang, Noto Serif KR, serif" text-anchor="middle"><text x="171" y="73" font-size="9" letter-spacing="3">문 장 사 이 독 서 노 트</text><text x="171" y="153" font-size="36" letter-spacing="-2">침묵의 세계</text><text x="171" y="185" font-size="11" letter-spacing="1.5">MAX PICARD</text></g><path d="M139 330v-91h65v91" fill="url(#door)"/><path d="m148 330 1-82 42-7-1 89" fill="#e8e9d8"/><path d="m149 248 41-7v89h-41Z" fill="#f6f5e8" opacity=".6"/><path d="m148 330-54 49h137l-41-49" fill="#f7f5e8" opacity=".52"/><path d="M94 379h137" stroke="#b9bea3" stroke-width=".7"/><text x="171" y="439" text-anchor="middle" fill="#5e654f" font-size="8" font-family="Georgia, serif" letter-spacing="1.7">A SPACE BEFORE WORDS</text><path d="m90 462 162-4" stroke="#a7ae92" stroke-width=".5"/></g></svg>
